name: wmts-automation tests (Linux)
on:
  push:
    paths: ["wmts-automation/**", ".github/workflows/wmts-automation-tests.yml"]
  pull_request:
    paths: ["wmts-automation/**"]
jobs:
  unit:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    defaults:
      run:
        working-directory: wmts-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wmts-automation/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit tests (fake GeoServer, no network)
        run: python -m pytest -q
      - name: Production entry point imports and serves /healthz
        env:
          GEOSERVER_PASS: not-used
        run: |
          python - <<'EOF'
          from wsgi import app
          r = app.test_client().get("/healthz")
          assert r.status_code == 200 and r.data == b"ok", r.status_code
          print("wsgi ok")
          EOF
